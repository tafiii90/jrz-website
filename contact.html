<header class="site-header">
 <div class="container nav">

    <img src="assets/logo.png" alt="JRZ logo"><span class="brand">JRZ</span>
  </a>
  <button class="menu" aria-label="Open menu" aria-expanded="false">☰</button>
  <nav class="nav-links" aria-label="Main navigation">

 </div>

<main>
<section class="page-hero"><div class="container">
 <div class="eyebrow">Contact</div><h1>Let's <span class="gradient">connect.</span></h1>
 <p class="prose">Replace the details below with your real contact information. The form is front-end only until you connect it to a service or backend.</p>
</div></section>
<section class="section"><div class="container contact">
 <div class="card"><h3>Get in touch</h3><p>hello@example.com</p><p>Instagram · Discord · WhatsApp</p></div>
 <form class="card form" onsubmit="event.preventDefault(); alert('Thanks! Connect this form to your preferred form service before publishing.');">
   <div><label>Name</label><input required placeholder="Your name"></div>
   <div><label>Email</label><input required type="email" placeholder="you@example.com"></div>
   <div><label>Message</label><textarea required placeholder="Your message"></textarea></div>
   <button class="btn btn-primary" type="submit">Send message</button>
 </form>
</div></section>
</main>
<footer><div class="container footer-inner">
  <a class="footer-logo" href="index.html"><img src="assets/logo.png" alt=""> <span>JRZ</span></a>

</div></footer>
